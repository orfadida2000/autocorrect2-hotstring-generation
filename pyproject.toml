[project]
name            = "autocorrect2-hotstring-generation"
version         = "0.1.0"
description     = "Generate keyboard typo hotstrings and validate them against AutoCorrect2."
authors         = [{ name = "Or Fadida", email = "or@fadida.net" }]
license         = { file = "LICENSE" }
readme          = "README.md"
requires-python = ">=3.12"
dependencies    = ["multypo>=0.1.1"]

[dependency-groups]
dev = ["ruff>=0.15.22"]
docs = [
    "mkdocs-git-revision-date-localized-plugin>=1.5,<2",
    "mkdocs-material>=9,<10",
    "mkdocs-print-site-plugin>=2.9,<3",
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv]
package        = false
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "N", "UP"]
ignore = [
    "ANN201",
    "ANN204",
    "ANN401",
    "B905",
    "C408",
    "E203",
    "E501",
    "N812",
    "UP007",
]

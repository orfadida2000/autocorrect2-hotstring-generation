site_name: AutoCorrect2 Hotstrings
site_url: https://orfadida2000.github.io/autocorrect2-hotstring-generation/
site_description: Generate typo-based AutoHotkey hotstrings and validate them against AutoCorrect2

repo_url: https://github.com/orfadida2000/autocorrect2-hotstring-generation
repo_name: orfadida2000/autocorrect2-hotstring-generation

theme:
  name: material

  logo: assets/icons/autocorrect2-spellcheck.svg
  favicon: assets/icons/ACicon.ico

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: dracula
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link

  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Project Background: project-background.md
  - Getting started: getting-started.md
  - Project structure: project-structure.md

  - Concepts:
      - Overview: concepts/index.md
      - Hotstrings and options: concepts/hotstrings.md
      - Typo generation: concepts/typo-generation.md
      - Conflict detection: concepts/conflict-detection.md
      - AutoCorrect2 integration: concepts/autocorrect2.md

  - Workflows:
      - Overview: workflows/index.md
      - Full pipeline: workflows/full-pipeline.md
      - Typo generation only: workflows/typo-generation.md
      - AutoCorrect2 check only: workflows/autocorrect2-check.md
      - Reporting: workflows/reporting.md

  - Configuration:
      - Typo generation: configuration/typo-generation.md
      - AutoCorrect2: configuration/autocorrect2.md

  - API Reference:
      - Overview: api/index.md

      - Core:
          - Overview: api/core/index.md
          - Models: api/core/models.md
          - Trigger representations: api/core/trigger.md
          - Hotstring options: api/core/options.md
          - Conflict detection: api/core/conflicts.md
          - Constants: api/core/constants.md

      - Pipelines: api/pipeline.md
      - Reports: api/report.md
      - File I/O: api/file-io.md
      - Constants: api/constants.md

      - Typo generation:
          - Overview: api/typo-generation/index.md
          - Models: api/typo-generation/models.md
          - Generation: api/typo-generation/generation.md
          - Execution: api/typo-generation/execution.md
          - Aggregation: api/typo-generation/aggregation.md

      - AutoCorrect2:
          - Overview: api/autocorrect2/index.md
          - Models: api/autocorrect2/models.md

          - Source loading:
              - Overview: api/autocorrect2/source_loading/index.md
              - Parser: api/autocorrect2/source_loading/parser.md
              - Cache: api/autocorrect2/source_loading/cache.md
              - Loader: api/autocorrect2/source_loading/loader.md

          - Writer: api/autocorrect2/writer.md
          - Integration: api/autocorrect2/integration.md
          - Constants: api/autocorrect2/constants.md

not_in_nav: |
  /license.md

plugins:
  - search
  - privacy
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
          paths:
            - .
          options:
            filters:
              - "!^__weakref__$"
              - "!^__dict__$"
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            show_source: true
            separate_signature: true
            show_signature_annotations: true
            scoped_crossrefs: true
            relative_crossrefs: true
            signature_crossrefs: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap
  - assets/stylesheets/extra.css
  - assets/stylesheets/catppuccin-latte.css
  - assets/stylesheets/catppuccin-mocha.css
  - assets/stylesheets/dracula.css

copyright: Copyright &copy; 2026 Or Fadida

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/orfadida2000
      name: My GitHub

    - icon: fontawesome/solid/envelope
      link: mailto:or@fadida.net
      name: Email
